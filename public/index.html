<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能任务管理系统</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6f9;
      color: #1f2937;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }
    .add-form {
      display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
      background: #fff; padding: 16px; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .add-form input[type="text"] {
      flex: 1; min-width: 180px; padding: 10px 12px;
      border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px;
    }
    .add-form select {
      padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px;
      background: #fff;
    }
    button { cursor: pointer; border: none; border-radius: 8px; font-size: 14px; }
    .btn-add {
      padding: 10px 18px; background: #2563eb; color: #fff; font-weight: 600;
    }
    .btn-add:hover { background: #1d4ed8; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; }
    .filters button {
      padding: 7px 14px; background: #fff; border: 1px solid #d1d5db; color: #374151;
    }
    .filters button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      display: flex; align-items: center; gap: 12px;
      background: #fff; padding: 14px 16px; border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .task-main { flex: 1; }
    .task-title { font-size: 16px; }
    .task-item.completed .task-title { text-decoration: line-through; color: #9ca3af; }
    .badge {
      display: inline-block; margin-left: 8px; padding: 2px 10px;
      border-radius: 999px; font-size: 12px;
    }
    .badge-高 { background: #fee2e2; color: #dc2626; }
    .badge-中 { background: #fef3c7; color: #d97706; }
    .badge-低 { background: #dbeafe; color: #2563eb; }
    .task-meta { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .btn-toggle { padding: 7px 12px; background: #f3f4f6; color: #374151; }
    .btn-toggle:hover { background: #e5e7eb; }
    .btn-delete { padding: 7px 12px; background: #fff; color: #dc2626; border: 1px solid #fecaca; }
    .btn-delete:hover { background: #fef2f2; }
    .empty { text-align: center; color: #9ca3af; padding: 40px 0; }
    .error { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRIORITIES = ['高', '中', '低'];

    function App() {
      const [tasks, setTasks] = useState([]);
      const [title, setTitle] = useState('');
      const [priority, setPriority] = useState('中');
      const [filter, setFilter] = useState('全部');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      async function fetchTasks(p) {
        const q = p && p !== '全部' ? `?priority=${encodeURIComponent(p)}` : '';
        const res = await fetch(`/api/tasks${q}`);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || '加载任务失败');
        }
        return res.json();
      }

      function load(p) {
        setLoading(true); setError('');
        fetchTasks(p || filter)
          .then(setTasks)
          .catch(e => setError(e.message))
          .finally(() => setLoading(false));
      }

      useEffect(() => { load('全部'); }, []);

      async function addTask() {
        if (!title.trim()) { setError('任务标题不能为空'); return; }
        setError('');
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, priority })
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          setError(body.error || '添加失败');
          return;
        }
        setTitle('');
        load();
      }

      async function toggleTask(id) {
        const res = await fetch(`/api/tasks/${id}/toggle`, { method: 'PATCH' });
        if (!res.ok) { const b = await res.json().catch(() => ({})); setError(b.error || '操作失败'); return; }
        load();
      }

      async function deleteTask(id) {
        const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        if (!res.ok) { const b = await res.json().catch(() => ({})); setError(b.error || '删除失败'); return; }
        load();
      }

      function changeFilter(f) {
        setFilter(f);
        load(f);
      }

      return (
        <div className="container">
          <h1>智能任务管理系统</h1>

          {error && <div className="error">{error}</div>}

          <div className="add-form">
            <input
              type="text"
              placeholder="输入任务标题…"
              value={title}
              onChange={e => setTitle(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addTask()}
            />
            <select value={priority} onChange={e => setPriority(e.target.value)}>
              {PRIORITIES.map(p => <option key={p} value={p}>{p}优先级</option>)}
            </select>
            <button className="btn-add" onClick={addTask}>添加</button>
          </div>

          <div className="filters">
            {['全部', '高', '中', '低'].map(f => (
              <button
                key={f}
                className={filter === f ? 'active' : ''}
                onClick={() => changeFilter(f)}
              >{f}</button>
            ))}
          </div>

          {loading ? (
            <div className="empty">加载中…</div>
          ) : tasks.length === 0 ? (
            <div className="empty">暂无任务，添加一条吧</div>
          ) : (
            <ul className="task-list">
              {tasks.map(task => (
                <li key={task.id} className={'task-item' + (task.completed ? ' completed' : '')}>
                  <div className="task-main">
                    <span className="task-title">{task.title}</span>
                    <span className={`badge badge-${task.priority}`}>{task.priority}</span>
                    <div className="task-meta">
                      {task.completed ? '已完成' : '未完成'}
                      {task.created_at ? ' · ' + new Date(task.created_at).toLocaleString('zh-CN') : ''}
                    </div>
                  </div>
                  <button className="btn-toggle" onClick={() => toggleTask(task.id)}>
                    {task.completed ? '标为未完成' : '标为完成'}
                  </button>
                  <button className="btn-delete" onClick={() => deleteTask(task.id)}>删除</button>
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
